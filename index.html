<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Sales Counter</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      transition: background-color 0.2s ease;
    }

    #counter {
      font-size: 160px;
      font-weight: 900;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
      letter-spacing: -2px;
      text-shadow: 0 6px 24px rgba(0, 0, 0, 0.55);
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), color 0.2s ease;
    }

    #counter.bump {
      transform: scale(1.08);
      color: #4ade80;
    }

    /* แผงตั้งค่า (ซ่อนไว้ตลอด กดดับเบิลคลิกหรือปุ่ม S เพื่อเปิด) */
    #panel {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 99;
    }

    #panel.open {
      display: flex;
    }

    .card {
      background: #18181b;
      color: #f4f4f5;
      width: 340px;
      padding: 20px;
      border-radius: 14px;
      border: 1px solid #27272a;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      font-size: 14px;
    }

    .card h3 {
      font-size: 16px;
      margin-bottom: 14px;
    }

    .row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .field {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    label {
      font-size: 12px;
      color: #a1a1aa;
    }

    input, select {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #3f3f46;
      background: #09090b;
      color: #ffffff;
      font-size: 14px;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-primary {
      background: #22c55e;
      color: #052e16;
    }

    .btn-secondary {
      background: #27272a;
      color: #e4e4e7;
    }

    .hint {
      margin-top: 12px;
      font-size: 11px;
      color: #71717a;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div id="counter">0</div>

  <div id="panel">
    <div class="card">
      <h3>ตั้งค่ายอดขายจำลอง</h3>

      <div class="row">
        <div class="field">
          <label>ยอดปัจจุบัน / เริ่มต้น</label>
          <input type="number" id="startVal" value="0" />
        </div>
        <div class="field">
          <label>ขนาดตัวเลข (px)</label>
          <input type="number" id="fontSize" value="160" />
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label>เพิ่มขั้นต่ำ (ต่อครั้ง)</label>
          <input type="number" id="minInc" value="1" />
        </div>
        <div class="field">
          <label>เพิ่มสูงสุด (ต่อครั้ง)</label>
          <input type="number" id="maxInc" value="5" />
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label>สุ่มทุกๆ กี่วิ (ต่ำสุด)</label>
          <input type="number" id="minSec" value="3" />
        </div>
        <div class="field">
          <label>สุ่มทุกๆ กี่วิ (สูงสุด)</label>
          <input type="number" id="maxSec" value="8" />
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label>พื้นหลัง</label>
          <select id="bgMode">
            <option value="#000000">สีดำ (ทั่วไป)</option>
            <option value="transparent">โปร่งใส (OBS Browser Source)</option>
            <option value="#00ff00">ฉากเขียว (Green Screen)</option>
          </select>
        </div>
        <div class="field">
          <label>สีตัวเลข</label>
          <input type="color" id="textColor" value="#ffffff" style="height: 36px; padding: 2px;" />
        </div>
      </div>

      <div class="actions">
        <button class="btn-secondary" id="togglePause">หยุดชั่วคราว</button>
        <button class="btn-primary" id="saveBtn">บันทึกและซ่อน</button>
      </div>

      <div class="hint">
        คีย์ลัดหน้าจอหลัก: <b>S</b> หรือ <b>ดับเบิลคลิก</b> เปิดตั้งค่า | <b>Space</b> หยุด/เดินต่อ | <b>ลูกศรขึ้น</b> เพิ่มยอดทันที
      </div>
    </div>
  </div>

  <script>
    const counterEl = document.getElementById("counter");
    const panelEl = document.getElementById("panel");

    const STORAGE_KEY = "live_sales_sim_v1";

    let config = {
      value: 0,
      fontSize: 160,
      minInc: 1,
      maxInc: 5,
      minSec: 3,
      maxSec: 8,
      bgMode: "#000000",
      textColor: "#ffffff"
    };

    let displayedValue = 0;
    let isPaused = false;
    let timerId = null;

    function loadConfig() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (saved) config = { ...config, ...saved };
      } catch (e) {}

      displayedValue = config.value;
      applyStyle();
      renderNumber(displayedValue);
      syncInputs();
    }

    function saveConfig() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
    }

    function applyStyle() {
      document.body.style.backgroundColor = config.bgMode;
      counterEl.style.fontSize = config.fontSize + "px";
      counterEl.style.color = config.textColor;
    }

    function syncInputs() {
      document.getElementById("startVal").value = config.value;
      document.getElementById("fontSize").value = config.fontSize;
      document.getElementById("minInc").value = config.minInc;
      document.getElementById("maxInc").value = config.maxInc;
      document.getElementById("minSec").value = config.minSec;
      document.getElementById("maxSec").value = config.maxSec;
      document.getElementById("bgMode").value = config.bgMode;
      document.getElementById("textColor").value = config.textColor;
      document.getElementById("togglePause").textContent = isPaused ? "เริ่มต่อ" : "หยุดชั่วคราว";
    }

    function renderNumber(num) {
      counterEl.textContent = Math.floor(num).toLocaleString("en-US");
    }

    function randomInt(min, max) {
      const lo = Math.min(min, max);
      const hi = Math.max(min, max);
      return Math.floor(Math.random() * (hi - lo + 1)) + lo;
    }

    function animateTo(target) {
      const start = displayedValue;
      const diff = target - start;
      const duration = Math.min(600, Math.max(200, Math.abs(diff) * 40));
      const startTime = performance.now();

      counterEl.classList.add("bump");
      setTimeout(() => {
        counterEl.classList.remove("bump");
        counterEl.style.color = config.textColor;
      }, 320);

      function step(now) {
        const progress = Math.min((now - startTime) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        displayedValue = start + diff * eased;
        renderNumber(displayedValue);

        if (progress < 1) {
          requestAnimationFrame(step);
        } else {
          displayedValue = target;
          renderNumber(target);
        }
      }

      requestAnimationFrame(step);
    }

    function triggerSale() {
      const inc = randomInt(Number(config.minInc), Number(config.maxInc));
      config.value = Number(config.value) + inc;
      saveConfig();
      animateTo(config.value);
    }

    function scheduleNext() {
      clearTimeout(timerId);
      if (isPaused) return;

      const delayMs = randomInt(Number(config.minSec) * 1000, Number(config.maxSec) * 1000);
      timerId = setTimeout(() => {
        if (!isPaused) {
          triggerSale();
          scheduleNext();
        }
      }, delayMs);
    }

    function togglePanel(force) {
      const open = typeof force === "boolean" ? force : !panelEl.classList.contains("open");
      if (open) syncInputs();
      panelEl.classList.toggle("open", open);
    }

    document.getElementById("saveBtn").addEventListener("click", () => {
      config.value = Number(document.getElementById("startVal").value) || 0;
      config.fontSize = Math.max(20, Number(document.getElementById("fontSize").value) || 160);
      config.minInc = Number(document.getElementById("minInc").value) || 1;
      config.maxInc = Number(document.getElementById("maxInc").value) || 5;
      config.minSec = Math.max(1, Number(document.getElementById("minSec").value) || 3);
      config.maxSec = Math.max(1, Number(document.getElementById("maxSec").value) || 8);
      config.bgMode = document.getElementById("bgMode").value;
      config.textColor = document.getElementById("textColor").value;

      displayedValue = config.value;
      saveConfig();
      applyStyle();
      renderNumber(config.value);
      togglePanel(false);
      scheduleNext();
    });

    document.getElementById("togglePause").addEventListener("click", () => {
      isPaused = !isPaused;
      syncInputs();
      scheduleNext();
    });

    document.body.addEventListener("dblclick", (e) => {
      if (!panelEl.contains(e.target)) togglePanel();
    });

    window.addEventListener("keydown", (e) => {
      if (["INPUT", "SELECT"].includes(document.activeElement.tagName)) return;

      if (e.key.toLowerCase() === "s") {
        togglePanel();
      } else if (e.code === "Space") {
        e.preventDefault();
        isPaused = !isPaused;
        syncInputs();
        scheduleNext();
      } else if (e.key === "ArrowUp") {
        triggerSale();
      }
    });

    loadConfig();
    scheduleNext();
  </script>
</body>
</html>
